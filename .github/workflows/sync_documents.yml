name: Tự động theo dõi văn bản đến

on:
  schedule:
    # Lịch chạy tự động định kỳ (07:30, 11:30, 14:00, 17:00 hàng ngày theo giờ UTC)
    - cron: '30 0,3,7,10 * * 1-5'
  workflow_dispatch: # Cho phép bấm nút chạy thủ công bất cứ lúc nào trên GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt Google Chrome & ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: latest

      - name: Cài đặt các thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 pypdf selenium google-generativeai gspread google-api-python-client oauth2client

      - name: Chạy script theo dõi văn bản đến
        env:
          OFFICE_PASSWORD: ${{ secrets.OFFICE_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_DOCS_ID: ${{ secrets.GOOGLE_DOCS_ID }}
        run: |
          python sync_documents.py

      - name: Đính kèm file văn bản có hạn (nếu có)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VanBanDen-Files
          path: VanBanCoHan/
