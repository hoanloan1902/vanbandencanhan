name: Tự động theo dõi văn bản đến

on:
  schedule:
    # Lịch chạy chuẩn xác theo khung giờ Việt Nam: 07:30, 10:30, 14:30, 17:30 hàng ngày
    # (Đã quy đổi sang giờ UTC bằng cách trừ đi 7 tiếng: 00:30, 03:30, 07:30, 10:30 UTC)
    - cron: '30 0,3,7,10 * * *'
  workflow_dispatch: # Cho phép bấm nút chạy thủ công bất cứ lúc nào trên GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Cho phép job chạy tối đa 20 phút để tránh timeout

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt Google Chrome & ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: latest

      - name: Cài đặt các thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 pypdf selenium

      - name: Chạy script theo dõi văn bản đến
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python sync_documents.py
