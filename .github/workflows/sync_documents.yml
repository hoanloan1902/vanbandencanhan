name: Tự động theo dõi văn bản đến

on:
  schedule:
    # Lịch chạy tự động định kỳ (07:30, 10:30, 14:30, 17:30 giờ Việt Nam từ Thứ 2 đến Thứ 6)
    - cron: '30 0,3,7,10 * * 1-5'
  workflow_dispatch: # Cho phép bấm nút chạy thủ công bất cứ lúc nào trên GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt Google Chrome & ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: latest

      - name: Cài đặt các thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 pypdf selenium

      - name: Chạy script theo dõi văn bản đến
        env:
          OFFICE_PASSWORD: ${{ secrets.OFFICE_PASSWORD }}
          GOOGLE_WEB_APP_URL: ${{ secrets.GOOGLE_WEB_APP_URL }}
        run: |
          python sync_documents.py
